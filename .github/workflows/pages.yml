name: Deploy whitebox to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and assemble static site
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          json.loads(pathlib.Path('data.json').read_text())
          p=pathlib.Path('_site'); p.mkdir()
          for f in ['index.html','pavilion.html','data.json','.nojekyll']:
              shutil.copy(f,p/f)
          assert 'pavilion.html' in (p/'index.html').read_text()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
